services:
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://aiteacher:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/aiteacher
      SEED_DEMO: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes: ["uploads:/data"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aiteacher
      POSTGRES_DB: aiteacher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiteacher"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
  uploads:
